# Read by the Fleet for ESPHome add-on. Do not remove.
# esphome-fleet:
#   schedule_last_run: '2026-09-08T08:00:01.200716+00:00'

########################################################################
# Berkey fill controller
#
# STATE: both QDY30A probes read real centimetres on one shared MAX485
# bus, verified in water.
#
#   Modbus address 1 = UPPER chamber
#   Modbus address 2 = LOWER chamber
#
# Label the physical probes. They are otherwise indistinguishable, and
# an unlabelled swap is silent: the fill logic treats the two chambers
# completely differently.
#
# THIS REVISION ADDS THE FILL LOGIC. Read the invariant below before
# changing any number in the substitutions block.
#
# Board: ESP32 DevKit (ESP-WROOM-32). Breadboard transceiver is the
# HW-97 (MAX485), which is why flow_control_pin is still here. The
# carrier PCB replaces it with a THVD1406 at 3V3, at which point GPIO4
# and three resistors disappear. See NETLIST.md section 7 for every
# change at the PCB switch-over. This file stays breadboard-correct
# until then.
#
# ── The invariant ───────────────────────────────────────────────────
# Everything added to the upper chamber ends up in the lower chamber.
# So the volume you may add is bounded by the LOWER chamber's
# headroom, not by the upper chamber's capacity:
#
#   allowed_cm = (lower_full - lower_now) - upper_now - safety_margin
#
# Both chambers are 21.6 cm across, so 1 cm = 366 mL in either one,
# which is why this can be done entirely in centimetres.
#
# ── Three independent stops ─────────────────────────────────────────
#   1. Upper level reaches target        (needs the upper probe)
#   2. Flow meter counts target volume   (needs the flow sensor)
#   3. Elapsed time exceeds the limit    (needs nothing)
# Whichever fires first closes the valve. Stop 3 is the one that
# actually saves you, because it depends on no sensor working.
#
# ── The fourth stop is not in this file ─────────────────────────────
# The float switch NC contact sits in series with the RELAY MODULE'S
# 5 V SUPPLY. When water lifts it, the module de-energises, channel 1
# drops to COM-NC, and the valve's close wire is energised. No GPIO,
# no code. GPIO33 only lets the firmware SEE the trip; it is not how
# the trip works. Do not rewire the float into the valve's open wire:
# that only stops driving the valve, and an actuator with no spring
# return then freezes wherever it is, which for an open valve means
# water keeps flowing. Leave the relay module's JD-VCC jumper FITTED
# or cutting VCC no longer drops the coils. (On the rev G PCB the float
# is the coil supply for K1 and K2 directly; there is no jumper.)
#
# ── VALVE TRAVEL IS 15 SECONDS ──────────────────────────────────────
# Read off the physical label, not the 5 s assumed in older revisions
# of this project. 10 to 11 s measured on the bench without water
# pressure. Three numbers below depend on it:
#   safety_margin_cm    - overshoot after the stop decision
#   no_flow_grace_ms    - must exceed travel, or the abort fires
#                         before the valve has finished opening
#   valve_travel_hold   - must exceed travel, or channel 2 breaks
#                         the open circuit mid-travel and the valve
#                         freezes part way. The leak check also waits
#                         this long after a stop (see below)
# RE-TIME THE ACTUAL CLOSE once the stainless body is on the 8 Nm
# motor and under water pressure.
#
# ── Water path (3 Oct 2026) ─────────────────────────────────────────
#   shutoff -> FLOW SENSOR -> restrictor -> valve -> lid inlet
# The flow sensor sits upstream of the valve, so it is always full of
# water at mains pressure. Two consequences for this file:
#   - It reads from the first second of a fill (no dry turbine).
#   - Any flow with the valve fully closed means the valve is passing.
#     The leak check relies on that.
#
# ── Numbers that are still placeholders ─────────────────────────────
# lower_full_cm, upper_full_cm and fill_below_cm are GUESSES until
# the probes are mounted and zeroed with two weighed 2 L additions.
# pulses_per_litre is a start value until calibrated with water.
# Until then, leave enable_filling off.
########################################################################

substitutions:
  # --- Chamber geometry, measured -----------------------------------
  ml_per_cm: "366"              # 21.6 cm diameter, both chambers

  # --- PLACEHOLDERS: set after probe mounting and zero calibration ---
  lower_full_cm: "20.0"         # depth you are willing to call full
  upper_full_cm: "20.0"         # upper chamber, mostly a fault check
  fill_below_cm: "5.0"          # start a fill when lower is under this

  # --- Safety ---------------------------------------------------------
  # 15 s travel at the 2 L/min target = ~500 mL = ~1.4 cm of overshoot.
  # 3.5 cm leaves real margin on top of that. Raise it if the measured
  # travel time comes back longer, or if the restrictor is set faster.
  safety_margin_cm: "3.5"
  min_fill_cm: "2.0"            # do not bother with a fill under this
  max_fill_seconds: "420"       # 7 min: ~1.8x a 7.6 L fill at 2 L/min
  probe_stale_ms: "60000"
  no_flow_grace_ms: "25000"     # MUST exceed valve travel (15 s) + margin
  valve_travel_hold: "20s"      # MUST exceed valve travel. See stop_fill

  # --- Flow sensor ----------------------------------------------------
  # YF-B1-S, stainless. Start value from the 2 Oct bench test:
  # 1080 - 180/Q gives about 990 at 2 L/min. CALIBRATE with water at
  # the real restricted rate: 1 to 2 L into a jug on a scale, three
  # runs, average. (660 was the brass YF-B1 and no longer applies.)
  pulses_per_litre: "990"

esphome:
  name: waterfilter-controller
  friendly_name: Water Filter Controller
  on_boot:
    priority: -100
    then:
      # A reboot mid-fill is an abort, never a resume. The relay has
      # already closed the valve for us; this just makes the software
      # state agree with the hardware state.
      - switch.turn_off: valve_open_cmd
      - switch.turn_off: valve_power
      - lambda: |-
          id(fill_active) = false;

esp32:
  board: esp32dev
  framework:
    type: arduino

# --- Networking -------------------------------------------------------

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Waterfilter Fallback"
    password: !secret wifi_bck

captive_portal:

api:
  encryption:
    key: !secret waterlevel_key

ota:
  - platform: esphome
    password: !secret waterlevel_ota

# --- Logging ----------------------------------------------------------
# Back down to INFO for day-to-day use.
#
# To chase a frame-level Modbus fault again, set level: VERBOSE and
# uncomment the logs: block below. The global level: is a CEILING —
# anything above it is compiled out of the firmware entirely, so
# modbus: VERBOSE under logs: does nothing unless level: is VERBOSE
# too. An earlier revision with level: DEBUG and modbus: VERBOSE
# printed no frame hex at all, which wasted real time.

logger:
  level: INFO
  # level: VERBOSE
  # logs:
  #   wifi: INFO
  #   api: INFO
  #   api.service: INFO
  #   sensor: INFO
  #   pulse_counter: INFO
  #   switch: INFO
  #   esp32: INFO
  #   component: INFO
  #   scheduler: INFO
  #   modbus: VERBOSE
  #   modbus_controller: DEBUG

# --- Modbus bus -------------------------------------------------------
# TX2/RX2 on the ESP32. Probe wiring: blue to A, yellow to B.
# GPIO16 sits AFTER the 10k/20k divider, on the far side of the
# breadboard's centre gap. Tapping it before the gap reads the
# undivided 5 V and is how this went wrong before.

uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  # Workaround for issue #17180. Forces the IDF UART to hand bytes over
  # one at a time instead of in batches, so the inter-frame timer does
  # not fire in the middle of a reply.
  rx_full_threshold: 1
  rx_timeout: 2
  # Do not add a debug: block here. It is not a passive observer; it
  # competes for the same incoming bytes. Use the logger logs: block
  # above instead, which prints frames without stealing them.

modbus:
  id: modbus_bus
  uart_id: modbus_uart
  flow_control_pin: GPIO4
  send_wait_time: 500ms

modbus_controller:
  - id: probe_upper
    address: 0x01
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 5s
    # Both probes share one bus. The throttle spaces requests out so
    # they do not tread on each other. Raise to 300ms if intermittent
    # timeouts ever appear.
    command_throttle: 200ms

  - id: probe_lower
    address: 0x02
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 5s
    command_throttle: 200ms

# --- State ------------------------------------------------------------

globals:
  - id: fill_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: abort_latched
    type: bool
    restore_value: no
    initial_value: "false"

  - id: fill_start_ms
    type: uint32
    restore_value: no
    initial_value: "0"

  - id: fill_start_pulses
    type: float
    restore_value: no
    initial_value: "0"

  - id: fill_target_upper_cm
    type: float
    restore_value: no
    initial_value: "0"

  - id: fill_allowed_ml
    type: float
    restore_value: no
    initial_value: "0"

  # Freshness watchdogs. A probe that stops answering must not leave
  # the logic acting on its last known value. A stale reading is worse
  # than no reading, because it looks plausible.
  - id: upper_last_ms
    type: uint32
    restore_value: no
    initial_value: "0"

  - id: lower_last_ms
    type: uint32
    restore_value: no
    initial_value: "0"

# --- Inputs from Home Assistant ---------------------------------------

binary_sensor:
  # Permission to fill. Unknown, unavailable, HA restarting and API
  # disconnected must ALL read as "do not fill", which is what the
  # explicit false default gives us. A WiFi hiccup therefore interrupts
  # a fill. That is intended.
  - platform: homeassistant
    id: fill_permitted
    entity_id: input_boolean.waterfilter_fill_permitted
    internal: true

  # Float switch. This is the SOFTWARE view of a HARDWARE interlock.
  # The trip works with the ESP32 unplugged; this only lets us log it
  # and refuse to restart.
  - platform: gpio
    id: float_tripped
    name: "Upper float switch tripped"
    device_class: problem
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 200ms
    on_press:
      then:
        - logger.log: "FLOAT SWITCH TRIPPED - hardware has already closed the valve"
        - script.execute:
            id: abort_fill
            reason: "float switch tripped"

# --- Sensors ----------------------------------------------------------

sensor:
  # force_new_range: true is MANDATORY on every sensor here. These
  # probes reject multi-register reads with a clean Modbus exception,
  # and modbus_controller merges adjacent registers by default.
  #
  # The /10 divisor comes from register 3 (decimals = 1), confirmed on
  # both units. If a probe is ever swapped, re-enable the diagnostic
  # sensors below and confirm 17 and 1 before trusting the divisor.
  - platform: modbus_controller
    modbus_controller_id: probe_upper
    name: "Upper chamber level"
    id: upper_level
    register_type: holding
    address: 0x0004
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    filters:
      - lambda: return x / 10.0;
    on_value:
      then:
        - lambda: id(upper_last_ms) = millis();

  - platform: modbus_controller
    modbus_controller_id: probe_lower
    name: "Lower chamber level"
    id: lower_level
    register_type: holding
    address: 0x0004
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    filters:
      - lambda: return x / 10.0;
    on_value:
      then:
        - lambda: id(lower_last_ms) = millis();

  # YF-B1-S has its own internal pull-up and drives the line; the
  # breadboard divider brings it to 3.3 V. No ESP32 pull-up here.
  - platform: pulse_counter
    pin:
      number: GPIO27
      mode:
        input: true
    name: "Flow rate"
    id: flow_rate
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    update_interval: 2s
    filters:
      - lambda: return x / ${pulses_per_litre};
    total:
      name: "Flow total pulses"
      id: flow_total
      unit_of_measurement: "pulses"
      accuracy_decimals: 0

  # How much may be added right now. Negative or small means no fill.
  # This is the invariant from the header, expressed once.
  - platform: template
    name: "Allowed addition"
    id: allowed_cm
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (isnan(id(upper_level).state) || isnan(id(lower_level).state)) {
        return 0.0;
      }
      float headroom = ${lower_full_cm} - id(lower_level).state;
      float allowed = headroom - id(upper_level).state - ${safety_margin_cm};
      float upper_room = ${upper_full_cm} - id(upper_level).state
                         - ${safety_margin_cm};
      if (allowed > upper_room) allowed = upper_room;
      return allowed < 0 ? 0.0 : allowed;

  - platform: template
    name: "Fill volume so far"
    id: fill_volume
    unit_of_measurement: "L"
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      if (!id(fill_active)) return 0.0;
      if (isnan(id(flow_total).state)) return 0.0;
      return (id(flow_total).state - id(fill_start_pulses))
             / ${pulses_per_litre};

  # --- Diagnostics, off by default ----------------------------------
  # Unit code and decimal count for each probe. Both confirmed as 17
  # (cm) and 1. Kept here rather than deleted so a probe swap is a
  # two-minute check instead of a retype from the protocol PDF.
  #
  # - platform: modbus_controller
  #   modbus_controller_id: probe_upper
  #   name: "Upper unit code"
  #   register_type: holding
  #   address: 0x0002
  #   value_type: S_WORD
  #   force_new_range: true
  #   entity_category: diagnostic
  #
  # - platform: modbus_controller
  #   modbus_controller_id: probe_upper
  #   name: "Upper decimals"
  #   register_type: holding
  #   address: 0x0003
  #   value_type: S_WORD
  #   force_new_range: true
  #   entity_category: diagnostic
  #
  # - platform: modbus_controller
  #   modbus_controller_id: probe_lower
  #   name: "Lower unit code"
  #   register_type: holding
  #   address: 0x0002
  #   value_type: S_WORD
  #   force_new_range: true
  #   entity_category: diagnostic
  #
  # - platform: modbus_controller
  #   modbus_controller_id: probe_lower
  #   name: "Lower decimals"
  #   register_type: holding
  #   address: 0x0003
  #   value_type: S_WORD
  #   force_new_range: true
  #   entity_category: diagnostic

# --- Outputs ----------------------------------------------------------

switch:
  # Channel 1. OFF is the resting state and drives the valve's CLOSE
  # wire through the relay's NC contact. That safety property lives in
  # the wiring, not here. Getting NO and NC backwards passes every test
  # you can run and leaves the valve open every time the system fails.
  - platform: gpio
    id: valve_open_cmd
    name: "Valve open command"
    pin:
      number: GPIO25
      inverted: true
    restore_mode: ALWAYS_OFF

  # Channel 2, in series with the valve's open wire. Off at rest, so a
  # welded channel 1 contact cannot drive the valve open while idle.
  # Opening therefore requires two GPIOs to be driven.
  - platform: gpio
    id: valve_power
    name: "Valve open circuit enable"
    pin:
      number: GPIO26
      inverted: true
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "Enable filling"
    id: enable_filling
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # Leave OFF until the probes are mounted and zeroed. Every level
    # number in substitutions: is a guess until then.

button:
  - platform: template
    name: "Fill now"
    on_press:
      then:
        - script.execute:
            id: try_start_fill
            manual: true

  - platform: template
    name: "Stop fill"
    on_press:
      then:
        - script.execute:
            id: abort_fill
            reason: "manual stop"

  - platform: template
    name: "Clear abort latch"
    on_press:
      then:
        - lambda: |-
            id(abort_latched) = false;
            ESP_LOGI("fill", "Abort latch cleared by hand");

text_sensor:
  - platform: template
    name: "Fill status"
    id: fill_status
    update_interval: 5s
    lambda: |-
      if (id(abort_latched)) return {"aborted - needs clearing"};
      if (id(fill_active)) return {"filling"};
      if (!id(enable_filling).state) return {"disabled"};
      if (!id(fill_permitted).state) return {"waiting - nobody home"};
      return {"idle"};

# --- Logic ------------------------------------------------------------

script:
  - id: try_start_fill
    parameters:
      manual: bool
    then:
      - lambda: |-
          if (id(fill_active)) return;

          if (id(abort_latched)) {
            ESP_LOGW("fill", "Refusing: abort latched, clear it by hand");
            return;
          }
          if (!id(enable_filling).state) return;

          // Permission. Anything other than an explicit true is a no.
          if (!id(fill_permitted).state) {
            if (manual) ESP_LOGW("fill", "Refusing: nobody home");
            return;
          }
          if (!api_is_connected()) {
            ESP_LOGW("fill", "Refusing: no API connection");
            return;
          }

          // The float must not already be sitting in water.
          if (id(float_tripped).state) {
            ESP_LOGW("fill", "Refusing: float switch is tripped");
            return;
          }

          // Both probes must be answering.
          uint32_t now = millis();
          if (isnan(id(upper_level).state) || isnan(id(lower_level).state)
              || (now - id(upper_last_ms)) > ${probe_stale_ms}
              || (now - id(lower_last_ms)) > ${probe_stale_ms}) {
            ESP_LOGW("fill", "Refusing: probe data stale");
            return;
          }

          // Automatic fills wait for the lower chamber to run down.
          // A manual press skips that but not any safety check.
          if (!manual && id(lower_level).state > ${fill_below_cm}) return;

          float allowed = id(allowed_cm).state;
          if (isnan(allowed) || allowed < ${min_fill_cm}) {
            if (manual) ESP_LOGW("fill", "Refusing: only %.1f cm allowed",
                                 allowed);
            return;
          }

          id(fill_target_upper_cm) = id(upper_level).state + allowed;
          id(fill_allowed_ml) = allowed * ${ml_per_cm};
          id(fill_start_pulses) = isnan(id(flow_total).state)
                                    ? 0 : id(flow_total).state;
          id(fill_start_ms) = now;
          id(fill_active) = true;

          ESP_LOGI("fill", "Starting: %.1f cm (%.0f mL), upper %.1f -> %.1f",
                   allowed, id(fill_allowed_ml),
                   id(upper_level).state, id(fill_target_upper_cm));
      - if:
          condition:
            lambda: return id(fill_active);
          then:
            # Enable the open circuit first, then command open.
            - switch.turn_on: valve_power
            - delay: 200ms
            - switch.turn_on: valve_open_cmd

  - id: stop_fill
    parameters:
      reason: string
    then:
      - lambda: |-
          if (id(fill_active)) {
            float litres = (id(flow_total).state - id(fill_start_pulses))
                           / ${pulses_per_litre};
            ESP_LOGI("fill", "Stopping (%s). Added %.2f L",
                     reason.c_str(), litres);
          }
          id(fill_active) = false;
      - switch.turn_off: valve_open_cmd
      # Hold the open circuit enabled through the valve's FULL travel,
      # then drop it so an idle welded contact cannot drive the valve
      # open. This delay MUST exceed the measured travel time (15 s on
      # the label) or channel 2 breaks the circuit mid-travel and the
      # valve freezes part way. Re-measure after the body swap.
      #
      # valve_power staying on also tells the leak check below that the
      # valve is still travelling closed and water is still allowed to
      # flow.
      - delay: ${valve_travel_hold}
      - switch.turn_off: valve_power

  - id: abort_fill
    parameters:
      reason: string
    then:
      - lambda: |-
          ESP_LOGE("fill", "ABORT: %s", reason.c_str());
          id(abort_latched) = true;
      - script.execute:
          id: stop_fill
          reason: !lambda return reason;

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(fill_active)) return;
          uint32_t elapsed = millis() - id(fill_start_ms);

          // --- Aborts: end the fill AND refuse to restart ------------

          if (!id(fill_permitted).state) {
            id(abort_fill)->execute("permission withdrawn");
            return;
          }
          if (!api_is_connected()) {
            id(abort_fill)->execute("API connection lost");
            return;
          }
          uint32_t now = millis();
          if ((now - id(upper_last_ms)) > ${probe_stale_ms}) {
            id(abort_fill)->execute("upper probe stale");
            return;
          }
          if ((now - id(lower_last_ms)) > ${probe_stale_ms}) {
            id(abort_fill)->execute("lower probe stale");
            return;
          }
          // Physics check. If the upper probe reads far below where the
          // fill started, something is wrong with a probe or the plumbing.
          if (id(upper_level).state < (id(fill_target_upper_cm)
                                       - ${upper_full_cm})) {
            id(abort_fill)->execute("upper level implausible");
            return;
          }
          // No water arriving when it should be. The grace period MUST
          // exceed the valve's travel time or this fires before the
          // valve has finished opening.
          if (elapsed > ${no_flow_grace_ms}
              && id(flow_rate).state < 0.1) {
            id(abort_fill)->execute("no flow with valve open");
            return;
          }

          // --- Stops: end the fill normally -------------------------

          if (id(upper_level).state >= id(fill_target_upper_cm)) {
            id(stop_fill)->execute("upper target reached");
            return;
          }
          float ml = (id(flow_total).state - id(fill_start_pulses))
                     / ${pulses_per_litre} * 1000.0;
          if (ml >= id(fill_allowed_ml)) {
            id(stop_fill)->execute("volume reached");
            return;
          }
          if (elapsed > (${max_fill_seconds} * 1000UL)) {
            id(stop_fill)->execute("timeout");
            return;
          }

  # Automatic trigger. Deliberately slow: nothing here is urgent, and a
  # 30 s poll means a transient sensor glitch cannot start a fill.
  - interval: 30s
    then:
      - script.execute:
          id: try_start_fill
          manual: false

  # Leak check. Water moving with the valve fully closed means the
  # valve is passing, jammed, or a relay contact has welded. Latch it
  # and shout.
  #
  # Skipped while valve_power is still on: that is the valve_travel_hold
  # window after a stop, when the valve is still travelling closed and
  # water legitimately keeps flowing. Without this, every normal fill
  # would latch a false leak abort on the next 10 s tick (fixed 3 Oct).
  #
  # The flow sensor sits upstream of the valve and never drains, so a
  # reading here after the hold is real flow through a closed valve,
  # not a draining pipe.
  - interval: 10s
    then:
      - if:
          condition:
            and:
              - lambda: return !id(fill_active);
              - lambda: return !id(valve_power).state;
              - lambda: return !isnan(id(flow_rate).state)
                               && id(flow_rate).state > 0.2;
          then:
            - lambda: |-
                if (!id(abort_latched)) {
                  ESP_LOGE("fill", "FLOW DETECTED WITH VALVE CLOSED");
                  id(abort_latched) = true;
                }
            - switch.turn_off: valve_open_cmd
            - switch.turn_off: valve_power
